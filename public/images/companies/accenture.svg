<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" role="img" aria-labelledby="title">
<title id="title">Accenture</title>
<g transform="translate(80, 0)">
<!-- Greater than symbol above the text -->
<text x="160" y="30" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" fill="#A100FF">&gt;</text>
<!-- accenture text below -->
<text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="400" letter-spacing="-1" fill="#A100FF">accenture</text>
</g>
</svg>
