  # ── Job 3: deploy to staging (auto, on every push to main) ───────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          npm install -g vercel@latest --allow-scripts=esbuild

          set +e
          OUTPUT=$(vercel --prod --yes --token="$VERCEL_TOKEN" 2>&1)
          EXIT_CODE=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Vercel staging deployment failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

          DEPLOY_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | head -1)

          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Vercel deployment succeeded but no deployment URL was found"
            exit 1
          fi

          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Staging URL: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Job 4: deploy to production (requires manual approval) ───────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://sodakedutech.in

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        run: |
          npm install -g vercel@latest
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
